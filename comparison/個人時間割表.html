<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>個人時間割表</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
    background: #F8FAFC;
    color: #0F172A;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Noto Sans CJK JP", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .container {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    padding: 12px 10px 32px;
  }

  /* Header & Controls */
  .top-bar {
    background: #FFFFFF;
    border: 1px solid #E2E8F0;
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .title-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .title-row h1 {
    font-size: 18px;
    font-weight: 700;
  }
  .subtitle {
    font-size: 11px;
    color: #64748B;
  }
  .controls {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }
  .ctrl-box {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }
  .ctrl-box label {
    font-size: 11px;
    font-weight: 600;
    color: #64748B;
  }
  .ctrl-box select {
    width: 100%;
    min-width: 0;
    height: 36px;
    padding: 0 8px;
    font-size: 13px;
    font-weight: 600;
    color: #0F172A;
    background: #F8FAFC;
    border: 1px solid #CBD5E1;
    border-radius: 8px;
    outline: none;
  }
  .ctrl-box select:focus {
    border-color: #2563EB;
    background: #FFFFFF;
  }
  .meta-line {
    margin-top: 8px;
    font-size: 11px;
    color: #475569;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 12px;
  }
  .dot-lbl {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 2px;
    display: inline-block;
    flex-shrink: 0;
  }

  /* Week filter pills */
  .week-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }
  .w-tab {
    border: 1px solid #E2E8F0;
    background: #FFFFFF;
    color: #475569;
    font-size: 12px;
    font-weight: 600;
    padding: 5px 11px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .w-tab.active {
    background: #0F172A;
    color: #FFFFFF;
    border-color: #0F172A;
  }

  /* Week Card */
  .week-card {
    background: #FFFFFF;
    border: 1px solid #E2E8F0;
    border-radius: 14px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .week-hdr {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 9px 12px;
    background: #F1F5F9;
    border-bottom: 1px solid #E2E8F0;
  }
  .w-title {
    font-size: 14px;
    font-weight: 700;
    color: #0F172A;
  }
  .w-range {
    font-size: 11px;
    color: #64748B;
    white-space: nowrap;
  }

  /* Vertical Timetable Grid: col 1 = period axis, cols 2..6 = Mon..Fri */
  .tt-grid {
    display: grid;
    grid-template-columns: 32px repeat(5, minmax(0, 1fr));
    grid-template-rows: auto repeat(6, minmax(52px, auto));
    width: 100%;
    background: #E2E8F0;
    gap: 1px;
  }
  .tt-corner {
    background: #F8FAFC;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    color: #64748B;
    padding: 6px 2px;
  }
  .tt-day-hdr {
    background: #F8FAFC;
    text-align: center;
    padding: 5px 2px;
    min-width: 0;
  }
  .tt-day-date {
    font-size: 11px;
    font-weight: 700;
    color: #0F172A;
    line-height: 1.2;
  }
  .tt-day-dow {
    font-size: 10px;
    color: #64748B;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }
  .day-tag {
    background: #DC2626;
    color: #FFFFFF;
    font-size: 9px;
    font-weight: 700;
    padding: 0 3px;
    border-radius: 3px;
    line-height: 1.3;
  }
  .tt-p-hdr {
    background: #F8FAFC;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: #475569;
    padding: 4px 2px;
  }
  .tt-cell {
    background: #FFFFFF;
    padding: 5px 4px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 2px;
    position: relative;
  }
  .tt-cell.empty {
    background: #F8FAFC;
  }
  .tt-cell.is-class {
    background: #EFF6FF;
  }
  .tt-cell.is-course {
    background: #ECFDF5;
  }
  .tt-cell.is-lhr {
    background: #F1F5F9;
  }
  .tt-cell.is-exam {
    background: #FFFBEB;
  }
  .tt-cell.changed {
    background: #FEF2F2;
    outline: 2px solid #DC2626;
    outline-offset: -2px;
  }
  .c-subj {
    font-size: 12px;
    font-weight: 700;
    color: #0F172A;
    line-height: 1.25;
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  .c-room {
    font-size: 10px;
    color: #64748B;
    line-height: 1.1;
  }
  .c-time {
    font-size: 9px;
    font-weight: 700;
    color: #DC2626;
    line-height: 1.1;
  }
  .c-chg {
    font-size: 9px;
    font-weight: 700;
    color: #FFFFFF;
    background: #DC2626;
    padding: 0 4px;
    border-radius: 3px;
    line-height: 1.3;
  }
  .c-note {
    font-size: 10px;
    color: #475569;
    line-height: 1.3;
    overflow-wrap: anywhere;
  }

  /* Post-week events (共通テスト・自己採点) */
  .after-list {
    border-top: 1px solid #E2E8F0;
  }
  .after-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-bottom: 1px solid #F1F5F9;
    background: #FEF2F2;
  }
  .after-row.selfcheck {
    background: #EFF6FF;
  }
  .after-row:last-child { border-bottom: none; }
  .after-date {
    width: 48px;
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 700;
    color: #0F172A;
    text-align: center;
  }
  .after-body {
    flex: 1;
    min-width: 0;
  }
  .after-title {
    font-size: 13px;
    font-weight: 700;
    color: #0F172A;
  }
  .after-note {
    font-size: 11px;
    color: #475569;
    margin-top: 1px;
    overflow-wrap: anywhere;
  }

  .footer-note {
    font-size: 11px;
    color: #64748B;
    text-align: center;
    margin-top: 8px;
    line-height: 1.5;
  }
</style>
</head>

  </nav>

  <main id="scheduleRoot"></main>

  <p class="footer-note">※ 1/8(金)④⑤の開始時刻は原表の時刻欄が空欄（③13:45〜／⑥14:50〜）。<br>※ 体育・社会・理科基礎の合同講座は講座枠の表記をそのまま表示しています。</p>
</div>

const classSel = document.getElementById("classSelect");
const courseSel = document.getElementById("courseSelect");
const root = document.getElementById("scheduleRoot");
const tabs = document.querySelectorAll(".w-tab");
let activeWeek = "all";

function render() {
  const ci = parseInt(classSel.value, 10);
  const mi = parseInt(courseSel.value, 10);
  const cRoom = ROOMS[ci];
  const mRoom = ROOMS[mi];

  let html = "";
  WEEKS.forEach((w, wi) => {
    if (activeWeek !== "all" && String(wi) !== activeWeek) return;

    // Header row (col 1: 限, cols 2..6: days)
    let gridItems = `<div class="tt-corner" style="grid-column:1;grid-row:1;">限</div>`;
    w.days.forEach((day, di) => {
      const col = di + 2;
      const tagHtml = day.tag ? `<span class="day-tag">${day.tag}</span>` : "";
      gridItems += `
        <div class="tt-day-hdr" style="grid-column:${col};grid-row:1;">
          <div class="tt-day-date">${day.emptyDay ? "—" : day.d}</div>
          <div class="tt-day-dow">${day.dow}${tagHtml}</div>
        </div>`;
    });

    // Period axis (rows 2..7 for periods 1..6)
    for (let p = 1; p <= 6; p++) {
      gridItems += `<div class="tt-p-hdr" style="grid-column:1;grid-row:${p + 1};">${p}</div>`;
    }

    // Day cells
    w.days.forEach((day, di) => {
      const col = di + 2;
      if (day.emptyDay) {
        gridItems += `<div class="tt-cell empty" style="grid-column:${col};grid-row:2 / 8;"><span class="c-note">休み</span></div>`;
        return;
      }
      const covered = new Set();
      day.slots.forEach(s => {
        for (let k = s.s; k < s.s + s.span; k++) covered.add(k);
        const rStart = s.s + 1;
        const rEnd = s.s + s.span + 1;

        if (s.type === "exam") {
          gridItems += `
            <div class="tt-cell is-exam" style="grid-column:${col};grid-row:${rStart} / ${rEnd};">
              <div class="c-subj">${s.title}</div>
              <div class="c-note">${s.note}</div>
            </div>`;
          return;
        }

        let subj = "", room = "", cls = "", isChanged = false;
        if (s.type === "class") {
          subj = s.data[ci];
          room = cRoom;
          cls = "is-class";
        } else if (s.type === "course") {
          subj = s.data[mi];
          room = mRoom;
          cls = "is-course";
          isChanged = Array.isArray(s.chg) && s.chg.includes(mi);
        } else {
          subj = "LHR";
          room = cRoom;
          cls = "is-lhr";
        }
        const chgCls = isChanged ? " changed" : "";
        const chgBadge = isChanged ? '<span class="c-chg">変更</span>' : "";
        const timeHtml = s.time ? `<span class="c-time">${s.time}</span>` : "";

        gridItems += `
          <div class="tt-cell ${cls}${chgCls}" style="grid-column:${col};grid-row:${rStart} / ${rEnd};">
            ${timeHtml}
            ${chgBadge}
            <div class="c-subj">${subj}</div>
            <div class="c-room">${room}</div>
          </div>`;
      });

      // Fill uncovered periods cleanly
      for (let p = 1; p <= 6; p++) {
        if (!covered.has(p)) {
          gridItems += `<div class="tt-cell empty" style="grid-column:${col};grid-row:${p + 1};"></div>`;
        }
      }
    });

    let afterHtml = "";
    if (w.after && w.after.length) {
      afterHtml = `<div class="after-list">` + w.after.map(a => `
        <div class="after-row ${a.kind}">
          <div class="after-date">${a.d}</div>
          <div class="after-body">
            <div class="after-title">${a.title}</div>
            <div class="after-note">${a.note}</div>
          </div>
        </div>`).join("") + `</div>`;
    }

    html += `
      <section class="week-card">
        <div class="week-hdr">
          <span class="w-title">${w.title}</span>
          <span class="w-range">${w.range}</span>
        </div>
        <div class="tt-grid">${gridItems}</div>
        ${afterHtml}
      </section>`;
  });
  root.innerHTML = html;
}

classSel.addEventListener("change", render);
courseSel.addEventListener("change", render);
tabs.forEach(btn => {
  btn.addEventListener("click", () => {
    tabs.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeWeek = btn.dataset.week;
    render();
  });
});

render();
</script>
